name: Performance or Compatibility
description: Report low FPS, lag, memory use, mod conflicts, networking issues, or server TPS problems.
title: "[Performance]: "
labels: ["performance"]
body:
  - type: input
    id: pack-version
    attributes:
      label: Pack version
      placeholder: "0.0.0"
    validations:
      required: true
  - type: dropdown
    id: issue-area
    attributes:
      label: Issue area
      options:
        - Client FPS or stutter
        - Client memory use
        - Server TPS or tick lag
        - Network latency or disconnects
        - Mod compatibility
        - World generation performance
        - Other
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Singleplayer
        - Multiplayer client
        - Dedicated server
        - LAN world
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System details
      placeholder: "CPU, GPU, RAM, OS, Java version"
    validations:
      required: true
  - type: input
    id: memory
    attributes:
      label: Allocated memory
      placeholder: "Client: 6 GiB, Server: 8 GiB"
    validations:
      required: true
  - type: textarea
    id: symptoms
    attributes:
      label: Symptoms
      description: Include FPS, TPS, memory use, affected dimensions, player count, view distance, shaders, and when it started.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, profiler output, or screenshots
      description: Attach latest.log, Spark reports, observable profiler output, screenshots, or server timings if available.
      placeholder: "Drag files here or link profiler output."
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reproduced this without adding or removing mods from the pack.
          required: true
        - label: I searched existing issues for a duplicate.
          required: true
